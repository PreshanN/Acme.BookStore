name: Backend CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Acme.BookStore.sln

    - name: Build Solution
      run: dotnet build Acme.BookStore.sln --no-restore --configuration Release

    - name: Run Complete Test Suite
      run: dotnet test Acme.BookStore.sln --no-build --configuration Release

    - name: EF Core Migration Consistency Check
      run: |
        dotnet tool install --global dotnet-ef
        dotnet ef migrations has-pending-model-changes --project src/Acme.BookStore.EntityFrameworkCore/Acme.BookStore.EntityFrameworkCore.csproj --startup-project src/Acme.BookStore.DbMigrator/Acme.BookStore.DbMigrator.csproj
